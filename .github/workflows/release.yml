name: Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build kubectl-mtv-mcp binary and archive
        run: make dist
        env:
          VERSION: ${{ github.event.release.tag_name }}

      - name: Upload kubectl-mtv-mcp release assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            dist/kubectl-mtv-mcp-${{ github.event.release.tag_name }}-linux-amd64.tar.gz
            dist/kubectl-mtv-mcp-${{ github.event.release.tag_name }}-linux-amd64.tar.gz.sha256sum
